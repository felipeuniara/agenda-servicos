<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${servico.id == null ? 'Novo serviço' : 'Editar serviço'})}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('servicos')}"></aside>

    <main class="app-main">
        <div th:replace="~{fragments/layout :: mobilebar}"></div>

        <div class="page-head">
            <div>
                <div class="crumb"><a th:href="@{/servicos}">Serviços</a> / <span
                        th:text="${servico.id == null} ? 'Novo serviço' : 'Editar serviço'">Novo serviço</span></div>
                <h1 th:text="${servico.id == null} ? 'Novo serviço' : 'Editar serviço'">Novo serviço</h1>
                <div class="sub">O valor do serviço deve ser maior que zero.</div>
            </div>
        </div>

        <form class="form-card" th:action="@{/servicos/salvar}" th:object="${servico}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">
            <h2>Dados do serviço</h2>

            <div class="flash flash-erro" th:if="${#fields.hasGlobalErrors()}" role="alert">
                <i class="bi bi-exclamation-circle"></i>
                <div><div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erro</div></div>
            </div>

            <div class="row g-3">
                <div class="col-12 col-md-8">
                    <label class="form-label" for="nome">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                           placeholder="Ex.: Corte feminino" maxlength="100">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label" for="valor">Valor (R$)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{valor}"
                           th:errorclass="is-invalid" placeholder="0,00" inputmode="decimal">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                </div>
            </div>

            <div class="form-actions">
                <a class="btn btn-ap-light" th:href="@{/servicos}">Cancelar</a>
                <button type="submit" class="btn btn-ap">Salvar serviço</button>
            </div>
        </form>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
